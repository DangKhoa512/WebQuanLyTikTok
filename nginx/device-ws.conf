# Include inside the HTTPS server only. Docker DNS is resolved at request time,
# so nginx can start while the optional device-manager profile is stopped.
location ^~ /device-ws/ {
    limit_req zone=api_zone burst=30 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $device_broker_upstream device_broker:3001;
    proxy_pass http://$device_broker_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 10s;
    access_log off;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# ── Main server block ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;          # replace with your domain in production

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # ── Security headers ────────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── Frontend static files ───────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires       1y;
        access_log    off;
        add_header    Cache-Control "public, immutable";
    }

    # ── Login endpoint — strict rate limit ─────────────────────────────────────
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass         http://backend:3000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ── All other API requests ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;

        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # Large cookie/token payloads
        client_max_body_size 20m;
    }

    # ── Health check (no rate limit, no log) ───────────────────────────────────
    location /health {
        proxy_pass  http://backend:3000/health;
        access_log  off;
    }
}

